<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Designframe mark on dark">
  <title>Designframe — mark on dark</title>
  <desc>Inverted brand mark for dark surfaces: white rounded-corner geometry with gradient "df" monogram inset.</desc>
  <defs>
    <linearGradient id="df-mark-grad-invert" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb03b9"/>
      <stop offset="100%" stop-color="#3883ff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="8" ry="8" fill="#ffffff"/>
  <text x="32" y="44" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="32" font-weight="800" letter-spacing="-0.04em" fill="url(#df-mark-grad-invert)">df</text>
</svg>

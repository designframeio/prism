<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" role="img" aria-label="Designframe wordmark">
  <title>Designframe — primary wordmark</title>
  <desc>Lowercase "designframe" set with the brand key gradient (pink to blue, right-top direction). Default usage on light backgrounds.</desc>
  <defs>
    <linearGradient id="df-grad-key" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb03b9"/>
      <stop offset="100%" stop-color="#3883ff"/>
    </linearGradient>
  </defs>
  <text x="0" y="44" font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="48" font-weight="700" letter-spacing="-0.02em" fill="url(#df-grad-key)">designframe</text>
</svg>
